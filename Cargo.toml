[package]
name = "wik"
version = "0.2.0"
edition = "2024"
rust-version = "1.99.1"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.11"
jiff = "1.0.3"
sha1 = "0.11.0"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
